<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <!-- Static on purpose: GitHub shows SVGs through <img>, and CSS transform animations
       there override per-line positions. Every line has its own absolute y. -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .dim { fill: #8b949e; }
    .cyan { fill: #58a6ff; font-weight: 600; }
    .green { fill: #3fb950; font-weight: 600; }
    .yellow { fill: #d29922; font-weight: 600; }
    .purple { fill: #bc8cff; font-weight: 600; }
    .white { fill: #f0f6fc; }
    .bold { font-weight: 700; }
  </style>

  <!-- Window -->
  <rect x="10" y="10" width="830" height="380" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  <path d="M10 22 a12 12 0 0 1 12 -12 h806 a12 12 0 0 1 12 12 v28 h-830 z" fill="#161b22" />
  <line x1="10" y1="50" x2="840" y2="50" stroke="#30363d" stroke-width="1" />
  <circle cx="32" cy="30" r="6" fill="#ff5f56" />
  <circle cx="52" cy="30" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="30" r="6" fill="#27c93f" />
  <text x="425" y="34" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">probe triage (illustrative) · output matches examples/outputs/01_confirmed_bug.md</text>

  <g class="t">
    <text x="32" y="82"><tspan class="purple">❯</tspan> <tspan class="cyan">probe</tspan> <tspan class="white">triage</tspan> <tspan class="dim">examples/issues/01_confirmed_bug.md</tspan> <tspan class="yellow">--repo examples/repos/shop --issue</tspan></text>

    <text x="32" y="112"><tspan class="dim">[1/4]</tspan> <tspan class="white">Extracting claims</tspan> <tspan class="cyan">(qwen3:8b via Ollama)</tspan> <tspan class="green">✔</tspan></text>
    <text x="50" y="132" class="dim">claim c1: bug_behavior · symbol apply_discount · file shop/billing.py</text>

    <text x="32" y="160"><tspan class="dim">[2/4]</tspan> <tspan class="white">Static AST check</tspan> <tspan class="purple">(probe.verify.static)</tspan> <tspan class="green">✔</tspan></text>
    <text x="50" y="180"><tspan class="green">supports</tspan> <tspan class="dim">· apply_discount is defined in shop/billing.py at line 6</tspan></text>

    <text x="32" y="208"><tspan class="dim">[3/4]</tspan> <tspan class="white">Docker sandbox</tspan> <tspan class="yellow">(no network · 15 s timeout · 128 PIDs)</tspan> <tspan class="green">✔</tspan></text>
    <text x="50" y="228"><tspan class="green">supports</tspan> <tspan class="dim">· reproduced failure: AssertionError: 0.0</tspan></text>

    <text x="32" y="256"><tspan class="dim">[4/4]</tspan> <tspan class="white">Verdict rules</tspan> <tspan class="cyan">(probe.verdict)</tspan> <tspan class="green">✔</tspan></text>

    <line x1="32" y1="276" x2="818" y2="276" stroke="#30363d" stroke-dasharray="4,4" />

    <text x="32" y="302" class="white bold">Probe evidence report: apply_discount returns the wrong price</text>
    <text x="32" y="326"><tspan class="white bold">Overall:</tspan> <tspan class="green">✅ Confirmed (high confidence)</tspan></text>
    <text x="32" y="350" class="dim">c1 confirmed · AssertionError: 0.0 reproduced in the sandbox; apply_discount found by AST lookup</text>
    <text x="32" y="374"><tspan class="purple">❯</tspan></text>
    <rect x="46" y="362" width="8" height="15" fill="#58a6ff" />
  </g>
</svg>
