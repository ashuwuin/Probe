<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" width="100%" height="470">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .cursor { animation: blink 1s infinite; fill: #58a6ff; }
    .term-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 1.5; }
    .t-dim { fill: #8b949e; }
    .t-cyan { fill: #58a6ff; font-weight: 600; }
    .t-green { fill: #3fb950; font-weight: 600; }
    .t-red { fill: #f85149; font-weight: 600; }
    .t-yellow { fill: #d29922; font-weight: 600; }
    .t-purple { fill: #bc8cff; font-weight: 600; }
    .t-white { fill: #f0f6fc; }
    .badge-confirmed { fill: #3fb950; font-weight: 700; }
    .step-1 { animation: lineFadeIn 0.5s ease-out 0.2s both; }
    .step-2 { animation: lineFadeIn 0.5s ease-out 0.7s both; }
    .step-3 { animation: lineFadeIn 0.5s ease-out 1.2s both; }
    .step-4 { animation: lineFadeIn 0.5s ease-out 1.7s both; }
    .step-5 { animation: lineFadeIn 0.5s ease-out 2.2s both; }
    .step-6 { animation: lineFadeIn 0.5s ease-out 2.7s both; }
  </style>

  <!-- Window Container -->
  <rect x="25" y="20" width="800" height="430" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Titlebar -->
  <rect x="25" y="20" width="800" height="40" rx="12" fill="#161b22" />
  <rect x="25" y="48" width="800" height="12" fill="#161b22" />
  <line x1="25" y1="60" x2="825" y2="60" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="45" cy="40" r="6" fill="#ff5f56" />
  <circle cx="65" cy="40" r="6" fill="#ffbd2e" />
  <circle cx="85" cy="40" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="425" y="44" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">probe triage — illustrative execution of examples/outputs/01_confirmed_bug.md</text>

  <!-- Terminal Content -->
  <g class="term-text" transform="translate(48, 88)">
    <!-- Command Prompt -->
    <g class="step-1">
      <text x="0" y="0"><tspan class="t-purple">❯</tspan> <tspan class="t-cyan">probe</tspan> <tspan class="t-white">triage</tspan> <tspan class="t-dim">examples/reports/01_confirmed_bug.txt</tspan> <tspan class="t-yellow">--repo examples/repos/shop --issue</tspan></text>
    </g>

    <!-- Pipeline Step 1 -->
    <g class="step-2" transform="translate(0, 26)">
      <text x="0" y="0"><tspan class="t-dim">[1/4]</tspan> <tspan class="t-white">Extracting technical claims</tspan> <tspan class="t-cyan">(qwen3:8b via Ollama)</tspan> <tspan class="t-green">✔</tspan></text>
      <text x="18" y="20" class="t-dim">Found claim `c1`: bug_behavior in `shop/billing.py` (symbol: `apply_discount`)</text>
    </g>

    <!-- Pipeline Step 2 -->
    <g class="step-3" transform="translate(0, 72)">
      <text x="0" y="0"><tspan class="t-dim">[2/4]</tspan> <tspan class="t-white">Verifying static AST</tspan> <tspan class="t-purple">(probe.verify.static)</tspan> <tspan class="t-green">✔</tspan></text>
      <text x="18" y="20"><tspan class="t-dim">AST check:</tspan> <tspan class="t-green">supports</tspan> <tspan class="t-dim">(symbol `apply_discount` defined in `shop/billing.py` at line 6)</tspan></text>
    </g>

    <!-- Pipeline Step 3 -->
    <g class="step-4" transform="translate(0, 118)">
      <text x="0" y="0"><tspan class="t-dim">[3/4]</tspan> <tspan class="t-white">Sandboxed Docker execution</tspan> <tspan class="t-yellow">(--network none · 15s timeout · 128 PIDs)</tspan> <tspan class="t-green">✔</tspan></text>
      <text x="18" y="20"><tspan class="t-dim">Sandbox run:</tspan> <tspan class="t-green">supports</tspan> <tspan class="t-dim">(reproduced failure: AssertionError: 0.0)</tspan></text>
    </g>

    <!-- Pipeline Step 4 -->
    <g class="step-5" transform="translate(0, 164)">
      <text x="0" y="0"><tspan class="t-dim">[4/4]</tspan> <tspan class="t-white">Computing truth table verdict</tspan> <tspan class="t-cyan">(probe.verdict)</tspan> <tspan class="t-green">✔</tspan></text>
    </g>

    <!-- Output Separator -->
    <g class="step-6" transform="translate(0, 192)">
      <line x1="0" y1="0" x2="754" y2="0" stroke="#30363d" stroke-dasharray="4,4" />

      <!-- Rendered Report -->
      <text x="0" y="24"><tspan class="t-white" font-weight="700">### 🔎 Probe evidence report: apply_discount returns the wrong price</tspan></text>
      <text x="0" y="46"><tspan class="t-white" font-weight="700">Overall:</tspan> <tspan class="badge-confirmed">✅ Confirmed (high confidence)</tspan></text>
      <text x="0" y="68" class="t-dim">Evidence: `apply_discount()` in `shop/billing.py` reproduced failure (AssertionError: 0.0)</text>
      <text x="0" y="90" class="t-green">✔ Verified with AST lookup + isolated zero-network Docker container run</text>
      <text x="0" y="112"><tspan class="t-purple">❯</tspan> <rect x="14" y="100" width="8" height="15" class="cursor" /></text>
    </g>
  </g>
</svg>
