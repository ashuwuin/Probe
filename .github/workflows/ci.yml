name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security Scan (Rule 3 - No API Keys or Secrets)
        run: |
          echo "Scanning for accidental secrets or hardcoded API keys..."
          SCAN_PATTERN=$(echo "QkVHSU4gW0EtWiBdKlBSSVZBVEUgS0VZfGdoW3BvdXNyXV9bQS1aYS16MC05XXsyMCx9fGdpdGh1YnBhdFtBLVphLXowLTlfXXsyMCx9" | base64 --decode)
          ! grep -rE "$SCAN_PATTERN" . \
            --exclude-dir={.git,.venv,venv} \
            --exclude=".env.example"

      - name: Pull Sandbox Docker Image
        run: |
          docker pull python:3.11-slim || true

      - name: Run Pytest Suite
        run: |
          pytest
