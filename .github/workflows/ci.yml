name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security Scan (Rule 3 - No API Keys or Secrets)
        run: |
          echo "Scanning for accidental secrets or hardcoded API keys..."
          ! grep -rE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|BEGIN PRIVATE KEY)" . \
            --exclude-dir={.git,.venv,venv,.github} \
            --exclude=".env.example"

      - name: Run Pytest Suite
        env:
          PYTHONPATH: src
        run: |
          pytest -v --tb=short
